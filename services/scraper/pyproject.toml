[project]
name = "pribor-scraper"
version = "0.0.1"
description = "Pribor veri toplama düzlemi — nazik scraper + immutable ham katman + AZ/RU normalizasyon"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "tenacity>=9.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
# JS-ağır sayfalar için: pip install -e ".[browser]" && playwright install chromium
browser = ["playwright>=1.49"]

[project.scripts]
pribor-scraper = "pribor_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pribor_scraper"]
