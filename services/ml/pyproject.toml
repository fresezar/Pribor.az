[project]
name = "pribor-ml"
version = "0.0.1"
description = "Pribor değerleme servisi — CatBoost quantile + SHAP (Faz 0: stub)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Gerçek model eğitimi/servisi Faz 0 sonunda bu ekstralarla açılır
model = [
    "catboost>=1.2",
    "shap>=0.46",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pribor_ml"]
