[project]
name = "pribor-ml"
version = "0.0.1"
description = "Pribor değerleme servisi — CatBoost quantile + SHAP (Faz 0: stub)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "catboost>=1.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.15",
]

[project.optional-dependencies]
# Gerçek veriden eğitim (train.py --no-synthetic) için DB sürücüsü
db = ["psycopg[binary]>=3.2"]
# Faz 2+: registry ve gelişmiş açıklanabilirlik
mlops = ["mlflow>=2.19", "shap>=0.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pribor_ml"]
