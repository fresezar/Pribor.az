# Mülkiyyətçi lenti — her gün Binə'nin son 60 günlük ilanlarını tazeler.
# Gerekli sır: Settings → Secrets → Actions → DATABASE_URL (Neon, ?sslmode=require)
# Elle çalıştırmak için: Actions → owner-feed → Run workflow
name: owner-feed

on:
  schedule:
    - cron: "0 3 * * *" # 07:00 Bakı
  workflow_dispatch:

concurrency: owner-feed

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toplayıcıyı kur
        run: pip install -e services/scraper
      - name: Lenti tazele
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pribor-scraper owner-feed --area bine --days 60
